# What the node needs of Zephyr on an nRF52840.

# The node's loop runs in main(): a handshake's arithmetic needs more stack than most
# (tern/contact.h), and 'selftest' says how much is left.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_PICOLIBC_IO_LONG_LONG=y

# The board: the radio's SPI bus and lines, the screen, the battery's ADC.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_DISPLAY=y
CONFIG_LORA=n

# The console, and the companion link a computer drives over it, are USB CDC ACM (the board's
# default). Nothing else writes to it: Zephyr's own log would land in the companion's stream.
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_LOG=n

# What the node saves: Zephyr's settings, on NVS, in the storage partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Keys from the chip's true generator.
CONFIG_ENTROPY_GENERATOR=y

CONFIG_REBOOT=y
CONFIG_POWEROFF=y

# The companion link over Bluetooth LE (src/ble.c): one peripheral connection, frames of up to 180
# bytes in one notification, and only LE Secure Connections pairing with a passkey the node shows,
# its bonds kept in the settings.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Tern"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=12
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_ATT_PREPARE_COUNT=0
