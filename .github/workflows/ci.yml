name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DTERN_WERROR=ON -DTERN_SANITIZE=ON
        env:
          CC: ${{ matrix.cc }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  macos:
    name: test (macos, clang)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DTERN_WERROR=ON -DTERN_SANITIZE=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # The core has to build for a microcontroller as well as a host. This builds it for a Cortex-M4F
  # (the nRF52840's class), freestanding, and fails if anything in it reaches past the compiler's
  # own runtime: no libc functions, no heap. GCC may emit calls to memcpy, memset, memmove and
  # memcmp even when freestanding, so every target has to provide those four, and they are allowed.
  cortex-m4:
    name: build (cortex-m4, freestanding)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-arm-none-eabi
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
          -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_TESTING=OFF -DTERN_WERROR=ON
      - run: cmake --build build
      - run: arm-none-eabi-size build/libtern.a
      - name: Check the core calls nothing outside itself, libgcc and the four mem functions
        run: |
          defined=$(arm-none-eabi-nm --defined-only build/libtern.a | awk 'NF == 3 { print $3 }' | sort -u)
          undefined=$(arm-none-eabi-nm -u build/libtern.a | awk 'NF == 2 { print $2 }' | sort -u)
          outside=$(comm -23 <(echo "$undefined") <(echo "$defined") | grep -Ev '^(__aeabi_.*|memcpy|memset|memmove|memcmp)$' || true)
          if [ -n "$outside" ]; then
            echo "The core depends on symbols it does not define:"
            echo "$outside"
            exit 1
          fi

  # The simulator (ternmesh/sim) links this core and runs it as a routing plugin, so its scenarios
  # are the core's regression suite: a mesh of two hundred nodes has to hold its routes, follow
  # them without going round, and keep to its cap. The simulator is taken at the commit named
  # here, moved on by hand, so that a change there cannot fail a check here.
  sim:
    name: test (in the simulator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ternmesh/sim
          ref: 8a6416b1fe8f9c31b3f3d49ed83b08ce645b6368
          path: sim
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >-
          cmake -S sim -B sim/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTSIM_WERROR=ON
          -DTSIM_FIRMWARE_DIR=$PWD -DTSIM_REQUIRE_CORE=ON
      - run: cmake --build sim/build
      - run: ctest --test-dir sim/build --output-on-failure -R core

  # The ESP32 port, built with ESP-IDF in Espressif's own container, the way a release builds it
  # (release.yml): for each board, an image for each region. They are kept with the run, so a board
  # can be flashed with any commit without installing anything (ports/esp32). A board added to
  # ports/esp32/boards/ is added here too.
  esp32:
    name: build (${{ matrix.board }}, esp-idf)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [heltec-v3, heltec-v4, heltec-wsl-v3, heltec-tracker, heltec-vme290, heltec-vme213, heltec-paper, heltec-v2, heltec-v21, lilygo-t3-v161, lilygo-tbeam, lilygo-tbeam12]
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: ports/esp32
          command: ./release.sh 0.0.0-dev ${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: tern-${{ matrix.board }}
          path: ports/esp32/release/
          if-no-files-found: error

  # The nRF52840 port, built with Zephyr in a west workspace its manifest pins (ports/nrf52/west.yml),
  # the way a release builds it: for each board, an image for each region, kept with the run. A
  # board added to ports/nrf52/release.sh is added here too.
  nrf52:
    name: build (${{ matrix.board }}, zephyr)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [heltec-t114, rak4631, wio-tracker-l1]
    steps:
      - uses: actions/checkout@v4
        with:
          path: firmware
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: firmware
          manifest-file-name: ports/nrf52/west.yml
          sdk-version: 1.0.1
          toolchains: arm-zephyr-eabi
      - run: pip3 install -r zephyr/scripts/requirements-base.txt
      - run: firmware/ports/nrf52/release.sh 0.0.0-dev ${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: tern-${{ matrix.board }}
          path: firmware/ports/nrf52/release/
          if-no-files-found: error

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: clang-format-18 --dry-run --Werror $(git ls-files '*.c' '*.h')
