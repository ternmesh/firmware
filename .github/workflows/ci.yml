name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DTERN_WERROR=ON -DTERN_SANITIZE=ON
        env:
          CC: ${{ matrix.cc }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  macos:
    name: test (macos, clang)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DTERN_WERROR=ON -DTERN_SANITIZE=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # The core has to build for a microcontroller as well as a host. This builds it for a Cortex-M4F
  # (the nRF52840's class), freestanding, and fails if anything in it reaches past the compiler's
  # own runtime: no libc functions, no heap. GCC may emit calls to memcpy, memset, memmove and
  # memcmp even when freestanding, so every target has to provide those four, and they are allowed.
  cortex-m4:
    name: build (cortex-m4, freestanding)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Arm's own toolchain, kept in the cache, not Ubuntu's gcc-arm-none-eabi: Ubuntu's mirror
      # trickled that package so slowly three times in a day that the job ran out of time. The
      # checksum is the one Arm publishes beside the file.
      - name: Cache the Arm toolchain
        id: arm-cache
        uses: actions/cache@v4
        with:
          path: arm-gnu-toolchain
          key: arm-gnu-toolchain-14.3.rel1-x86_64
      - name: Download the Arm toolchain
        if: steps.arm-cache.outputs.cache-hit != 'true'
        run: |
          file=arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 30 -o "$file" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/$file"
          echo "8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd  $file" | sha256sum -c -
          mkdir arm-gnu-toolchain
          tar xf "$file" -C arm-gnu-toolchain --strip-components=1
          rm "$file"
      - run: echo "$PWD/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
          -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_TESTING=OFF -DTERN_WERROR=ON
      - run: cmake --build build
      - run: arm-none-eabi-size build/libtern.a
      - name: Check the core calls nothing outside itself, libgcc and the four mem functions
        run: |
          defined=$(arm-none-eabi-nm --defined-only build/libtern.a | awk 'NF == 3 { print $3 }' | sort -u)
          undefined=$(arm-none-eabi-nm -u build/libtern.a | awk 'NF == 2 { print $2 }' | sort -u)
          outside=$(comm -23 <(echo "$undefined") <(echo "$defined") | grep -Ev '^(__aeabi_.*|memcpy|memset|memmove|memcmp)$' || true)
          if [ -n "$outside" ]; then
            echo "The core depends on symbols it does not define:"
            echo "$outside"
            exit 1
          fi

  # The simulator (ternmesh/sim) links this core and runs it as a routing plugin, so its scenarios
  # are the core's regression suite: a mesh of two hundred nodes has to hold its routes, follow
  # them without going round, and keep to its cap. The simulator is taken at the commit named
  # here, moved on by hand, so that a change there cannot fail a check here.
  sim:
    name: test (in the simulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ternmesh/sim
          ref: 77d68d485d18043a923b7f0f5d499b21c8a68a83
          path: sim
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >-
          cmake -S sim -B sim/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTSIM_WERROR=ON
          -DTSIM_FIRMWARE_DIR=$PWD -DTSIM_REQUIRE_CORE=ON
      - run: cmake --build sim/build
      - run: ctest --test-dir sim/build --output-on-failure -R core

  # The ESP32 port, built with ESP-IDF in Espressif's own container, the way a release builds it
  # (release.yml): for each board, an image for each region. They are kept with the run, so a board
  # can be flashed with any commit without installing anything (ports/esp32). A board added to
  # ports/esp32/boards/ is added here too.
  esp32:
    name: build (${{ matrix.board }}, esp-idf)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        board: [heltec-v3, heltec-v4, heltec-wsl-v3, heltec-tracker, heltec-vme290, heltec-vme213, heltec-paper, heltec-v2, heltec-v21, lilygo-t3-v161, lilygo-tbeam, lilygo-tbeam12, lilygo-t3s3]
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: ports/esp32
          command: ./release.sh 0.0.0-dev ${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: tern-${{ matrix.board }}
          path: ports/esp32/release/
          if-no-files-found: error

  # The nRF52840 port, built with Zephyr in a west workspace its manifest pins (ports/nrf52/west.yml),
  # the way a release builds it: for each board, an image for each region, kept with the run. A
  # board added to ports/nrf52/release.sh is added here too.
  nrf52:
    name: build (${{ matrix.board }}, zephyr)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        board: [heltec-t114, rak4631, wio-tracker-l1, t1000-e]
    steps:
      - uses: actions/checkout@v4
        with:
          path: firmware
      - uses: ./firmware/.github/actions/zephyr
      - run: firmware/ports/nrf52/release.sh 0.0.0-dev ${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: tern-${{ matrix.board }}
          path: firmware/ports/nrf52/release/
          if-no-files-found: error

  # Signing a release (docs/signing.md), with the specification's published test key, never the
  # release key: the tool agrees with the specification's vectors, signs and verifies, and a file
  # changed after signing, or a key the firmware does not hold, fails.
  signing:
    name: signing (test key)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "cryptography>=42"
      - run: python3 tools/release_key.py selftest
      - name: Sign and verify with the test key
        run: |
          mkdir -p "$RUNNER_TEMP/release" && cd "$RUNNER_TEMP/release"
          head -c 5000 /dev/urandom >tern-test-app.bin
          head -c 3000 /dev/urandom >tern-test.uf2
          python3 "$GITHUB_WORKSPACE/tools/release_key.py" --test sign tern-test-app.bin tern-test.uf2
          test "$(wc -l <SIGNATURES)" -eq 2
          grep -Eq '^[0-9a-f]{128}  tern-test-app\.bin$' SIGNATURES
          python3 "$GITHUB_WORKSPACE/tools/release_key.py" --test verify tern-test-app.bin tern-test.uf2
          echo x >>tern-test-app.bin
          tool="python3 $GITHUB_WORKSPACE/tools/release_key.py"
          # Each of these must fail; `!` would not stop the step, so each is tested.
          if $tool --test verify tern-test-app.bin; then exit 1; fi
          if TERN_RELEASE_SIGNING_KEY= $tool sign tern-test-app.bin; then exit 1; fi
          if $tool --test listed; then exit 1; fi

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: clang-format-18 --dry-run --Werror $(git ls-files '*.c' '*.h')
