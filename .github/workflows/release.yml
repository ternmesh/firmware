name: Release

# A tag v<version> makes a release: every board's images for each region, the ESP32 boards' and the
# nRF52840 boards', built from the tag, with one SHA256SUMS over them all and the notes in
# docs/releases/v<version>.md. A version with a hyphen in it (0.1.0-alpha.1) is marked a
# pre-release.
#
# Every file a release carries is signed (draft/companion.md, "Signed images"; docs/signing.md):
# one file, SIGNATURES, has a line for each, Ed25519 by the release key, whose private half is the
# secret TERN_RELEASE_SIGNING_KEY. A release is never published unsigned: without the secret, or with a key
# that ports/node/release_keys.h does not list, so that the nodes built here would refuse what it
# signs, the release fails, first before anything is built and again before anything is published.
#
# Each board is built in a job of its own, as CI builds them: one after another, the ESP32 boards'
# 117 builds took nearly four hours. The boards are the ports' own lists, ports/esp32/boards/ and
# the targets in ports/nrf52/release.sh, so a board added there is in the next release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
      esp32: ${{ steps.boards.outputs.esp32 }}
      nrf52: ${{ steps.boards.outputs.nrf52 }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version, and find its notes
        id: tag
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-z.]+)?$'
          test -f "docs/releases/$GITHUB_REF_NAME.md"
          echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "cryptography>=42"
      # Before hours of builds: the key is there, the firmware holds it, and no build takes
      # unsigned images.
      - name: Check the release key
        env:
          TERN_RELEASE_SIGNING_KEY: ${{ secrets.TERN_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$TERN_RELEASE_SIGNING_KEY" ]; then
            echo "::error::The secret TERN_RELEASE_SIGNING_KEY is not set. A release is never published unsigned: see docs/signing.md."
            exit 1
          fi
          python3 tools/release_key.py selftest
          python3 tools/release_key.py listed
          if grep -rn "CONFIG_TERN_UPDATE_UNSIGNED=y" ports/esp32/sdkconfig.defaults* ports/esp32/boards ports/nrf52/prj.conf ports/nrf52/boards; then
            echo "::error::A release build would take unsigned updates (CONFIG_TERN_UPDATE_UNSIGNED)."
            exit 1
          fi
      - name: List the boards
        id: boards
        run: |
          esp32=$(for f in ports/esp32/boards/*.defaults; do basename "$f" .defaults; done |
            jq -Rnc '[inputs]')
          nrf52=$(sed -n 's/^targets="\(.*\)"$/\1/p' ports/nrf52/release.sh | tr ' ' '\n' |
            cut -d: -f1 | jq -Rnc '[inputs | select(. != "")]')
          test "$esp32" != "[]" && test "$nrf52" != "[]"
          echo "esp32=$esp32" >>"$GITHUB_OUTPUT"
          echo "nrf52=$nrf52" >>"$GITHUB_OUTPUT"

  esp32:
    name: esp32 (${{ matrix.board }})
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.version.outputs.esp32) }}
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: ports/esp32
          command: ./release.sh ${{ needs.version.outputs.version }} ${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-${{ matrix.board }}
          path: ports/esp32/release/*.bin
          if-no-files-found: error

  nrf52:
    name: nrf52 (${{ matrix.board }})
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.version.outputs.nrf52) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: firmware
      - uses: ./firmware/.github/actions/zephyr
      - run: firmware/ports/nrf52/release.sh ${{ needs.version.outputs.version }} ${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: nrf52-${{ matrix.board }}
          path: |
            firmware/ports/nrf52/release/*.uf2
            firmware/ports/nrf52/release/*.zip
          if-no-files-found: error

  publish:
    needs: [esp32, nrf52]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: images
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "cryptography>=42"
      - name: Sum
        run: |
          cd images
          sha256sum -- *.bin *.uf2 *.zip >SHA256SUMS
          cat SHA256SUMS
      # Each image, and SHA256SUMS, signed, and every signature checked against the keys the
      # firmware holds before anything is published.
      - name: Sign
        env:
          TERN_RELEASE_SIGNING_KEY: ${{ secrets.TERN_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$TERN_RELEASE_SIGNING_KEY" ]; then
            echo "::error::The secret TERN_RELEASE_SIGNING_KEY is not set. A release is never published unsigned: see docs/signing.md."
            exit 1
          fi
          python3 tools/release_key.py listed
          python3 tools/release_key.py sign images/*.bin images/*.uf2 images/*.zip images/SHA256SUMS
          python3 tools/release_key.py verify images/*.bin images/*.uf2 images/*.zip images/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release carries over five hundred files. Uploaded at once they can trip GitHub's
          # secondary rate limit (0.7.0-alpha.1's first run), so the release is made
          # as a draft, filled fifty files at a time with a pause and retries, and published only
          # once every file is on it. A rerun reuses a draft left by a failed one.
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          if ! gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft | grep -qx true; then
            gh release create "$GITHUB_REF_NAME" $pre --draft --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          fi
          ls images/*.bin images/*.uf2 images/*.zip images/SHA256SUMS images/SIGNATURES >files
          split -l 50 files batch.
          for b in batch.*; do
            for try in 1 2 3 4 5 6; do
              if xargs gh release upload "$GITHUB_REF_NAME" --clobber <"$b"; then break; fi
              if [ "$try" = 6 ]; then echo "::error::Uploading $b failed six times"; exit 1; fi
              sleep $((try * 60))
            done
            sleep 10
          done
          want=$(wc -l <files)
          have=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets | length')
          if [ "$have" != "$want" ]; then
            echo "::error::The draft has $have files, not $want"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
